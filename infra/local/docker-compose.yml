# Try the S3 sink locally: a folder of docs on your machine, deployed to a
# MinIO bucket. Requires @kenjura/ursa >= 0.103.0 on npm (the image installs
# from npm).
#
#   docker compose up --build
#   edit ./docs/*.md, then browse http://localhost:9001 (ursa / ursa-dev-password)
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ursa
      MINIO_ROOT_PASSWORD: ursa-dev-password
    volumes: [minio-data:/data]

  make-bucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 ursa ursa-dev-password; do sleep 1; done;
             mc mb --ignore-existing local/ursa-site"

  ursa-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports: ["8080:8080", "7071:7071"]
    environment:
      AWS_ACCESS_KEY_ID: ursa
      AWS_SECRET_ACCESS_KEY: ursa-dev-password
      URSA_SERVER_TOKEN: dev-token
    volumes:
      - ./ursa-server.yml:/config/ursa-server.yml:ro
      - ./docs:/docs:ro
      - state:/data
    depends_on:
      make-bucket:
        condition: service_completed_successfully

volumes:
  minio-data:
  state:
